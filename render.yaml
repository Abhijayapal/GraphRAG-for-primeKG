services:
  # 1. Neo4j Database (Private Service)
  # NOTE: Persistent disks require a paid Render plan.
  - type: pserv
    name: neo4j-db
    env: docker
    image: neo4j:5.26.0
    disk:
      name: neo4j-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NEO4J_AUTH
        value: neo4j/admin1234  # You should change this in the dashboard or environment group
      - key: NEO4J_PLUGINS
        value: '["graph-data-science"]'
      - key: NEO4J_ACCEPT_LICENSE_AGREEMENT
        value: "yes"

  # 2. Backend API
  - type: web
    name: graphrag-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NEO4J_URI
        value: bolt://neo4j-db:7687  # Connects internally to the private Neo4j service
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: admin1234
      - key: PYTHON_VERSION
        value: 3.12.0

  # 3. Chainlit UI
  - type: web
    name: graphrag-ui
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m chainlit run ui/chatbot.py -h 0.0.0.0 -p $PORT"
    envVars:
      - key: BACKEND_URL
        value: https://graphrag-backend.onrender.com # Use the actual URL of the backend once deployed
      - key: GROQ_API_KEY
        sync: false # Set this in the Render dashboard manually
      - key: PYTHON_VERSION
        value: 3.12.0
