services:
  # 1. Backend API (Free Tier Web Service)
  - type: web
    name: graphrag-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # You will provide these securely in the Render dashboard
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0

  # 2. Chainlit UI (Free Tier Web Service)
  - type: web
    name: graphrag-ui
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m chainlit run ui/chatbot.py -h 0.0.0.0 -p $PORT"
    envVars:
      - key: BACKEND_URL
        value: https://graphrag-backend.onrender.com # Use the actual URL of the backend once deployed
      - key: GROQ_API_KEY
        sync: false # Set this in the Render dashboard manually
      - key: PYTHON_VERSION
        value: 3.12.0
